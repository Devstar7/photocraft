name: Finalize STAR7 branding
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Apply reviewed product text and start CI and Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import urllib.request, textwrap
          url='https://raw.githubusercontent.com/Devstar7/photocraft/4c526454ad62be6aab334b421d1542b35b711ea4/.github/workflows/finalize-star7.yml'
          with urllib.request.urlopen(url) as response: original=response.read().decode()
          script=textwrap.dedent(original.split('run: |\n',1)[1])
          script=script.replace('entries=[]',"rules.pop('.github/workflows/release.yml', None)\nentries=[]",1)
          script=script.replace('with urllib.request.urlopen(req) as r:', 'with urllib.request.urlopen(req, timeout=60) as r:')
          exec(compile(script,'reviewed-star7-branding','exec'))
